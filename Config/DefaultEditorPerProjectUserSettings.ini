; The testbed serves port 18766 instead of the plugin default 18765, so running the smoke test never reaches the editor of
; another project that uses the plugin on the same machine. Tools/mcp_smoke.py and .mcp.json use this port.
[/Script/AgentMcpToolset.AgentMcpSettings]
Port=18766
; Tools/mcp_smoke.py writes temporary skills to this folder to check skills_list and skills_get.
+SkillDirectories=Saved/MCP/SmokeSkills
